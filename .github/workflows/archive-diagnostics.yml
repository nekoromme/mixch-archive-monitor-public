name: Archive page diagnostics
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/archive-diagnostics.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Archive regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify all public archive pages without notifications or writes
        env:
          PUBLIC_LOGS: 'true'
        run: |
          python - <<'PY'
          import json
          import mixcha_watcher as w
          driver = w.create_driver()
          found = empty = failed = 0
          try:
              users = json.load(open("watchlist.json"))[12:13]
              for i, user in enumerate(users, 1):
                  try:
                      marker, date = w.get_latest_marker(driver, user["id"], index=i, total=len(users))
                      found += marker != "NO_VIDEO"
                      empty += marker == "NO_VIDEO"
                  except Exception as error:
                      failed += 1
                      print("READ_FAILED", i, type(error).__name__)
                      soup = w.BeautifulSoup(driver.page_source, "html.parser")
                      for tag in soup(["script", "style"]):
                          tag.decompose()
                      print("EMPTY_PAGE_TEXT", soup.get_text(" ", strip=True)[:12000])
              print("VERIFIED_COUNTS", json.dumps(dict(total=len(users), found=found, empty=empty, failed=failed)))
              if failed:
                  raise RuntimeError("Some archive pages could not be read")
          finally:
              driver.quit()
          PY
