name: Archive page diagnostics
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/archive-diagnostics.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Inspect public archive structure without notifications
        run: |
          python - <<'PY'
          import json, time
          from bs4 import BeautifulSoup
          import mixcha_watcher as w
          driver = w.create_driver()
          try:
              for user in json.load(open("watchlist.json"))[:2]:
                  driver.get("https://mixch.tv/u/" + user["id"] + "/live_archives")
                  time.sleep(12)
                  soup = BeautifulSoup(driver.page_source, "html.parser")
                  for tag in soup(["script", "style"]):
                      tag.decompose()
                  print("PAGE_TEXT", soup.get_text(" ", strip=True)[:14000])
                  print("DURATION_ELEMENTS", [(s.name, s.get("class"), s.get_text(" ", strip=True)) for s in soup.find_all(["span","time"]) if ":" in s.get_text()][:30])
                  print("ARCHIVE_LINKS", [(a.get("href"),a.get_text(" ",strip=True)) for a in soup.find_all("a",href=True) if "archive" in a["href"]][:10])
          finally:
              driver.quit()
          PY
