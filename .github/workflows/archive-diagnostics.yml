name: Archive page diagnostics
on:
  push:
    branches: [main]
    paths:
      - 'archive_metadata.py'
      - 'archive_diagnostics.py'
      - 'mixcha_watcher.py'
      - '.github/workflows/archive-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Archive regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify all public archive pages without notifications or writes
        env:
          PUBLIC_LOGS: 'true'
        run: python archive_diagnostics.py
