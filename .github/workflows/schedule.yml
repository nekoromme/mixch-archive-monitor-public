name: MixChannel Archive Monitor

run-name: >-
  Archive Monitor / ${{ github.event_name == 'schedule' && format('cron {0}', github.event.schedule) || format('manual by {0}', github.actor) }}

on:
  workflow_dispatch:
    inputs:
      replay_base:
        description: '取りこぼし再送の開始側・公開リポジトリのデータコミットSHA（通常実行は空欄）'
        required: false
        type: string
      replay_head:
        description: '取りこぼし再送の終了側・公開リポジトリのデータコミットSHA'
        required: false
        type: string
      replay_label:
        description: 'Discord通知に表示する区間名'
        required: false
        type: string
  schedule:
    # GitHub Actions の schedule は UTC 基準です。
    # 毎日 JST 06:07（UTC前日21:07）
    - cron: '7 21 * * *'
    # 毎日 JST 17:07, 19:07（UTC同日08:07,10:07）
    - cron: '7 8,10 * * *'
    # 毎日 JST 21:07（UTC同日12:07）
    - cron: '7 12 * * *'
    # 土日のみ JST 08:07（UTC前日23:07）
    - cron: '7 23 * * 5,6'
    # 土日のみ JST 14:07（UTC同日05:07）
    - cron: '7 5 * * 6,0'

permissions:
  contents: write
  actions: read

concurrency:
  group: mixch-archive-data-writer
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Ensure Chrome is available
        if: inputs.replay_base == ''
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y wget gnupg
            wget -q -O - https://dl.google.com/linux/linux_signing_key.pub \
              | sudo gpg --dearmor -o /usr/share/keyrings/google-linux-signing-keyring.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-linux-signing-keyring.gpg] http://dl.google.com/linux/chrome/deb/ stable main" \
              | sudo tee /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          fi
          google-chrome --version

      - name: Validate archive JSON files
        run: |
          python -m json.tool watchlist.json >/dev/null
          python -m json.tool state.json >/dev/null
          python -m json.tool activity_state.json >/dev/null

      - name: Prepare sanitized run metrics
        run: |
          : > run_metrics.jsonl

      - name: Validate Discord notification secret
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          if [[ -z "${DISCORD_WEBHOOK_URL}" ]]; then
            echo "::error::DISCORD_WEBHOOK_URL is not configured for this repository."
            exit 1
          fi

      - name: Run watcher
        if: inputs.replay_base == ''
        env:
          MIXCH_DATA_DIR: .
          PUBLIC_LOGS: 'true'
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python mixcha_watcher.py

      - name: Replay missed notifications
        if: inputs.replay_base != ''
        env:
          MIXCH_DATA_DIR: .
          PUBLIC_LOGS: 'true'
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPLAY_BASE: ${{ inputs.replay_base }}
          REPLAY_HEAD: ${{ inputs.replay_head }}
          REPLAY_LABEL: ${{ inputs.replay_label }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python replay_notifications.py

      - name: Commit updated public data
        if: inputs.replay_base == '' && success()
        shell: bash
        run: |
          git config user.name "mixch-bot"
          git config user.email "bot@example.com"
          git add -- state.json activity_state.json watchlist.json

          if git diff --cached --quiet; then
            echo "No archive data changes to commit."
            exit 0
          fi

          git commit -m "chore(bot): update archive monitor state [skip ci]"

          # スマホ管理画面や名前取得処理が同時に更新した場合に、
          # その変更を上書きせず取り込んでから送信します。
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload sanitized run metrics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sanitized-run-metrics-${{ github.run_id }}
          path: run_metrics.jsonl
          if-no-files-found: warn
          retention-days: 3
