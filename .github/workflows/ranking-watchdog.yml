name: ランキング監視の自動復旧
on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/ranking-watchdog.yml]
permissions:
  actions: write
  contents: write
concurrency:
  group: mixch-ranking-watchdog
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      RANKING_SCHEDULER: cloudflare
      WATCHDOG_STALE_MINUTES: '12'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: 全体設定を確認
        id: control
        working-directory: ranking
        run: |
          python3 - <<'PY'
          import os
          from src.control import ranking_enabled
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('enabled=' + str(ranking_enabled()).lower() + '\n')
          PY
      - name: 履歴の保存場所を設定
        run: echo "WATCHDOG_STATE_FILE=$RUNNER_TEMP/ranking-watchdog.json" >> "$GITHUB_ENV"
      - name: 復旧処理の履歴を読む
        if: steps.control.outputs.enabled == 'true'
        run: |
          git fetch origin ranking-watchdog-state --depth=1
          git show origin/ranking-watchdog-state:state.json > "$WATCHDOG_STATE_FILE"
      - name: 必要な場合だけ再起動
        if: steps.control.outputs.enabled == 'true'
        working-directory: ranking
        run: python3 -m src.github_actions_recovery watchdog
      - name: 復旧履歴を保存
        if: always() && steps.control.outputs.enabled == 'true'
        run: |
          test -s "$WATCHDOG_STATE_FILE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --force-create ranking-watchdog-state origin/ranking-watchdog-state
          cp "$WATCHDOG_STATE_FILE" state.json
          git add state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: update ranking recovery state [skip ci]'
          git push origin HEAD:ranking-watchdog-state
