<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン｜ミクチャ監視対象管理</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#20242b;font:16px/1.6 system-ui,sans-serif}
    main{max-width:440px;margin:12vh auto;padding:24px}form{background:white;padding:28px 24px;border:1px solid #e0e4ea;border-radius:18px}
    h1{font-size:23px;margin:0 0 24px}label{display:block;font-weight:700;margin-bottom:8px}
    input,button{width:100%;min-height:52px;font:inherit;border-radius:10px}
    input{border:1px solid #aab2c0;padding:12px}button{margin-top:20px;background:#1769d2;color:white;border:0;font-weight:700}
    button:disabled{opacity:.6}p{font-size:14px;color:#596273}#status{color:#b42318;overflow-wrap:anywhere}
  </style>
</head>
<body>
<main><form id="login">
  <h1>ミクチャ監視対象管理</h1>
  <label for="password">専用パスワード</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256">
  <button id="submit" type="submit">ログイン</button>
  <p>ログイン状態は最長30日間保持されます。</p>
  <p id="status" role="alert"></p>
</form></main>
<script>
document.getElementById('login').addEventListener('submit', async event => {
  event.preventDefault();
  const button = document.getElementById('submit');
  const status = document.getElementById('status');
  if (button.disabled) return;
  button.disabled = true;
  status.textContent = '';
  try {
    const response = await fetch('/api/login', {
      method: 'POST', credentials: 'same-origin', redirect: 'manual',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: document.getElementById('password').value}),
      signal: AbortSignal.timeout(20000),
    });
    if (!response.headers.get('content-type')?.includes('application/json')) {
      throw new Error('ログイン画面を開き直してください。');
    }
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'ログインできませんでした。');
    document.getElementById('password').value = '';
    location.replace('/');
  } catch (error) {
    status.textContent = error.name === 'TimeoutError' || error.name === 'TypeError'
      ? '通信に失敗しました。少し待って再度お試しください。' : error.message;
    button.disabled = false;
  }
});
</script>
</body></html>
