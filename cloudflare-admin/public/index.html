<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8">

  <!--
    width=device-width:
    スマートフォンの画面幅に合わせます。

    viewport-fit=cover:
    iPhoneの画面端やセーフエリアに対応します。
  -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>ウォッチ管理</title>

  <style>
    :root {
      color-scheme: light;

      --primary: #1769e0;
      --primary-dark: #0f57c7;
      --danger: #d93025;
      --danger-light: #fff0ef;

      --bg: #f5f6f8;
      --card: #ffffff;

      --text: #202124;
      --muted: #646970;
      --border: #dfe1e5;

      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      width: 100%;
      min-height: 100%;
      background: var(--bg);
    }

    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

      font-size: 16px;
      line-height: 1.45;
    }

    body.form-open {
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.985);
    }

    button:disabled {
      opacity: 0.55;
      transform: none;
    }

    /*
     * 上部ヘッダー
     *
     * 再読み込みボタンはここだけに残します。
     */
    header {
      position: sticky;
      top: 0;
      z-index: 10;

      padding:
        calc(10px + var(--safe-top))
        12px
        9px;

      background: rgba(255, 255, 255, 0.97);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .header-title-area {
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    h1 {
      margin: 0;
      font-size: 19px;
      line-height: 1.25;
      white-space: nowrap;
    }

    .count {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .reload-button {
      flex: 0 0 auto;
      min-height: 40px;
      padding: 7px 13px;
      background: #e8f0fe;
      color: #174ea6;
      font-size: 14px;
    }

    .status {
      min-height: 0;
      margin-top: 5px;
      font-size: 13px;
      font-weight: 700;
    }

    .status:empty {
      display: none;
    }

    .status.error {
      display: block;
      color: var(--danger);
    }

    .status.ok {
      display: block;
      color: #188038;
    }

    .status.loading {
      display: block;
      color: var(--muted);
    }

    .meta {
      margin-top: 4px;
      color: var(--danger);
      font-size: 12px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .meta:empty {
      display: none;
    }

    /*
     * 配信者一覧
     *
     * 画面下の新規追加ボタンに隠れないよう、
     * 下側に大きめの余白を確保しています。
     */
    main {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;

      padding:
        10px
        10px
        calc(94px + var(--safe-bottom));
    }

    .list {
      display: grid;
      gap: 9px;
    }

    .item {
      width: 100%;
      padding: 12px;

      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;

      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .item-main {
      min-width: 0;
      margin-bottom: 10px;
      overflow-wrap: anywhere;
    }

    .name {
      font-size: 19px;
      font-weight: 800;
      line-height: 1.3;
    }

    .id {
      margin-top: 1px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .actions button {
      min-height: 45px;
      padding: 8px 10px;
    }

    .edit-button {
      background: #e8f0fe;
      color: #174ea6;
    }

    .delete-button {
      background: var(--danger);
      color: #ffffff;
    }

    .empty {
      padding: 30px 16px;
      text-align: center;
      color: var(--muted);
    }

    /*
     * 初回読み込み中に表示する仮カードです。
     *
     * 真っ白な画面より「読み込み中」と分かりやすくします。
     */
    .skeleton {
      height: 116px;
      border-radius: 14px;
      background:
        linear-gradient(
          90deg,
          #eceef1 25%,
          #f6f7f8 37%,
          #eceef1 63%
        );
      background-size: 400% 100%;
      animation: skeleton-loading 1.3s ease infinite;
    }

    @keyframes skeleton-loading {
      0% {
        background-position: 100% 0;
      }

      100% {
        background-position: 0 0;
      }
    }

    /*
     * 画面下部の新規追加ボタン
     *
     * 再読み込みボタンを削除し、
     * 新規追加だけを画面幅いっぱいに表示します。
     */
    .add-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 15;

      padding:
        9px
        10px
        calc(9px + var(--safe-bottom));

      background: rgba(255, 255, 255, 0.96);
      border-top: 1px solid var(--border);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .add-bar-inner {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }

    .add-button {
      width: 100%;
      min-height: 58px;
      padding: 12px 16px;

      background: var(--primary);
      color: #ffffff;

      border-radius: 15px;
      font-size: 19px;

      box-shadow: 0 4px 12px rgba(23, 105, 224, 0.22);
    }

    .add-button:active {
      background: var(--primary-dark);
    }

    /*
     * 新規追加・編集画面
     *
     * dialog要素はiPhoneで位置や表示倍率が
     * 不安定になることがあるため使用しません。
     *
     * 代わりに、画面全体を覆う固定画面にしています。
     */
    .form-screen {
      position: fixed;
      inset: 0;
      z-index: 100;

      width: 100%;
      height: 100vh;
      height: 100dvh;

      background: var(--bg);
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    .form-screen[hidden] {
      display: none !important;
    }

    .form-header {
      position: sticky;
      top: 0;
      z-index: 2;

      display: grid;
      grid-template-columns: 74px 1fr 74px;
      align-items: center;
      gap: 6px;

      min-height: 58px;

      padding:
        calc(7px + var(--safe-top))
        10px
        7px;

      background: rgba(255, 255, 255, 0.98);
      border-bottom: 1px solid var(--border);
    }

    .back-button {
      min-height: 42px;
      padding: 7px 8px;
      background: #eef0f2;
      color: #333333;
      font-size: 14px;
    }

    .form-title {
      margin: 0;
      text-align: center;
      font-size: 20px;
      line-height: 1.3;
    }

    .form-content {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;

      padding:
        14px
        12px
        calc(24px + var(--safe-bottom));
    }

    .form-card {
      width: 100%;
      padding: 15px 13px;

      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 15px;
    }

    .field-group + .field-group {
      margin-top: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 16px;
      font-weight: 800;
    }

    .field-note {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    input[type="text"] {
      display: block;
      width: 100%;
      min-width: 0;
      height: 52px;

      margin: 0;
      padding: 10px 11px;

      background: #ffffff;
      color: var(--text);

      border: 1px solid #b8bdc4;
      border-radius: 11px;

      /*
       * iPhoneは入力欄の文字が16px未満だと
       * 自動的に画面を拡大することがあります。
       *
       * 18pxにすることで自動ズームを防ぎます。
       */
      font-size: 18px;
      line-height: 1.2;

      appearance: none;
      -webkit-appearance: none;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #4fa7e9;
      box-shadow: 0 0 0 3px rgba(79, 167, 233, 0.24);
    }

    .form-status {
      min-height: 0;
      margin-top: 10px;
      font-size: 13px;
      font-weight: 700;
    }

    .form-status:empty {
      display: none;
    }

    .form-status.error {
      display: block;
      color: var(--danger);
    }

    .form-status.loading {
      display: block;
      color: var(--muted);
    }

    .form-actions {
      display: grid;
      grid-template-columns: 0.85fr 1.15fr;
      gap: 9px;
      margin-top: 15px;
    }

    .form-actions button {
      min-height: 52px;
      padding: 10px;
      font-size: 16px;
    }

    .cancel-button {
      background: #eef0f2;
      color: #333333;
    }

    .save-button {
      background: var(--primary);
      color: #ffffff;
    }

    /*
     * パソコンでは少し余白を広げます。
     * 基本設計はあくまでスマートフォン優先です。
     */
    @media (min-width: 700px) {
      main {
        padding-left: 14px;
        padding-right: 14px;
      }

      .form-content {
        padding-top: 22px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-row">
      <div class="header-title-area">
        <h1>MixChannel 監視対象管理</h1>
        <span id="count" class="count"></span>
      </div>

      <button
        id="reloadButton"
        class="reload-button"
        type="button"
        onclick="loadList()"
      >
        再読み込み
      </button>
    </div>

    <div id="status" class="status"></div>
    <div id="meta" class="meta"></div>
    <!-- 誤操作を防ぐため、監視設定はページを開くたびに折りたたみます。 -->
    <details style="padding:8px 0">
      <summary style="cursor:pointer;font-size:14px;padding:10px 0">監視設定 <span id="monitoringState" style="color:#666">（確認中）</span></summary>
      <strong style="display:block;font-size:14px;margin-top:8px">アーカイブ監視（全体）</strong>
      <button id="globalMonitor" type="button" disabled onclick="toggleGlobalMonitor()"
        style="display:block;max-width:100%;min-height:44px;padding:10px 16px;margin-top:8px;border-radius:10px;font-size:14px;font-weight:bold">状態を確認中…</button>
      <div style="font-size:14px;margin-top:8px">全員の監視をまとめて停止・再開します。対象一覧は残ります。実行中の処理は完了し、次回の監視から反映されます。</div>
    </details>
    <button type="button" onclick="logout()" style="margin-top:8px;font-size:14px;padding:6px 12px">ログアウト</button>
  </header>

  <main>
    <div id="list" class="list"></div>
  </main>

  <!--
    画面下には、よく使う新規追加ボタンだけを表示します。
  -->
  <div class="add-bar">
    <div class="add-bar-inner">
      <button
        class="add-button"
        type="button"
        onclick="openForm()"
      >
        ＋ 新規追加
      </button>
    </div>
  </div>

  <!--
    新規追加・編集用の全画面フォームです。

    iPhoneで表示位置が崩れやすいdialog要素は使いません。
  -->
  <div
    id="formScreen"
    class="form-screen"
    role="dialog"
    aria-modal="true"
    aria-labelledby="formTitle"
    hidden
  >
    <form id="streamerForm" onsubmit="saveForm(event)">
      <div class="form-header">
        <button
          class="back-button"
          type="button"
          onclick="closeForm()"
        >
          ← 戻る
        </button>

        <h2 id="formTitle" class="form-title">新規追加</h2>

        <!--
          中央のタイトルを正確に中央揃えするための空欄です。
        -->
        <span aria-hidden="true"></span>
      </div>

      <div class="form-content">
        <div class="form-card">
          <input type="hidden" id="targetIndex">
          <input type="hidden" id="targetId">
          <input type="hidden" id="targetName">
          <input type="hidden" id="targetArchiveEnabled">

          <div class="field-group">
            <label for="streamerId">
              IDまたはMixChannelのURL

              <span class="field-note">
                数字だけでも、アプリからコピーしたURLでも登録できます
              </span>

              <span id="autoNameNote" class="field-note">
                名前はプロフィールから自動取得し、先頭10文字で登録します
              </span>
            </label>

            <input
              type="text"
              id="streamerId"
              inputmode="url"
              enterkeyhint="next"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              placeholder="18533166 またはURLを貼り付け"
              required
            >
          </div>

          <div id="streamerNameGroup" class="field-group">
            <label for="streamerName">配信者名</label>

            <input
              type="text"
              id="streamerName"
              inputmode="text"
              enterkeyhint="done"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              placeholder="配信者名を入力"
              required
            >
          </div>



          <div id="formStatus" class="form-status"></div>

          <div class="form-actions">
            <button
              type="button"
              class="cancel-button"
              onclick="closeForm()"
            >
              キャンセル
            </button>

            <button
              id="saveButton"
              type="submit"
              class="save-button"
            >
              保存
            </button>
          </div>
        </div>
      </div>
    </form>
  </div>

  <script>

    // Cloudflare側の保存処理との通信。GitHubの鍵はブラウザへ渡しません。
    let currentVersion = null;
    let monitoring = null;
    async function loadMonitoring() {
      const response = await fetch('/api/monitoring', { credentials:'same-origin', cache:'no-store', signal:AbortSignal.timeout(25000) });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || '全体監視設定を読み込めませんでした。');
      monitoring = result;
      // 閉じていても、現在のオン・オフだけは確認できます。
      document.getElementById('monitoringState').textContent = result.enabled ? '（監視中）' : '（停止中）';
      const button = document.getElementById('globalMonitor');
      button.textContent = result.enabled ? 'オン：全体を停止する' : 'オフ（停止中）：全体を再開する';
      button.style.background = result.enabled ? '#1769d2' : '#e3e6eb';
      button.style.color = result.enabled ? '#fff' : '#20242b';
    }
    async function toggleGlobalMonitor() {
      if (loading || !monitoring) return;
      setLoading(true);
      try {
        const response = await fetch('/api/monitoring', {
          method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({enabled:!monitoring.enabled, version:monitoring.version}), signal:AbortSignal.timeout(25000),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || '保存結果を確認できません。再読み込みしてください。');
        await loadMonitoring();
        setStatus(monitoring.enabled ? '全体の監視を再開しました。次回の定期実行から監視します。' : '全体の監視を停止しました。対象一覧はそのまま残ります。', 'success');
      } catch (error) { monitoring = null; handleError(error); }
      finally { setLoading(false); }
    }

    async function logout() {
      if (loading) return;
      setLoading(true);
      try {
        const response = await fetch('/api/logout', { method: 'POST',
          credentials: 'same-origin', signal: AbortSignal.timeout(20000) });
        if (!response.ok) throw new Error('ログアウトできませんでした。再度お試しください。');
        localStorage.removeItem(CACHE_KEY);
        location.replace('/');
      } catch (error) { handleError(error); }
    }
    function adminApi() {
      let onSuccess = () => {};
      let onFailure = handleError;
      async function call(action, data) {
        try {
          const isRead = action === 'watchlist';
          const response = await fetch('/api/' + action, {
            method: isRead ? 'GET' : 'POST',
            credentials: 'same-origin',
            cache: 'no-store',
            redirect: 'manual',
            headers: { 'Content-Type': 'application/json' },
            ...(isRead ? {} : { body: JSON.stringify({ ...data, version: currentVersion }) }),
            signal: AbortSignal.timeout(25000),
          });
          if (response.type === 'opaqueredirect' || response.status === 401 ||
              !response.headers.get('content-type')?.includes('application/json')) {
            throw new Error('ログインが切れた可能性があります。ページを開き直して専用パスワードでログインしてください。');
          }
          const result = await response.json();
          if (!response.ok) {
            throw new Error((result.error || '処理に失敗しました。') +
              (result.requestId ? '（確認番号: ' + result.requestId + '）' : ''));
          }
          if (isRead) currentVersion = result.version;
          onSuccess(result);
        } catch (error) {
          const networkError = ['TimeoutError', 'AbortError', 'TypeError'].includes(error.name);
          onFailure(networkError
            ? new Error('通信結果を確認できません。保存を連打せず、再読み込みして確認してください。')
            : error);
        }
      }
      const runner = {
        withSuccessHandler(fn) { onSuccess = fn; return runner; },
        withFailureHandler(fn) { onFailure = fn; return runner; },
        getWatchlist() { return call('watchlist'); },
        addStreamer(streamer) { return call('add', { streamer }); },
        updateStreamer(target, streamer) { return call('update', { target, streamer }); },
        deleteStreamer(target) { return call('delete', { target }); },
      };
      return runner;
    }

    /*
     * 現在表示している配信者一覧です。
     */
    let items = [];

    /*
     * 通信中の二重操作を防止するための状態です。
     */
    let loading = false;

    /*
     * GitHub Actionsが名前を取得している間だけ使う再読み込み予約です。
     */
    let pendingNameRefreshTimer = null;

    /*
     * 前回取得した一覧をブラウザ内へ一時保存する際の名前です。
     *
     * 2回目以降は前回の一覧をすぐ表示し、
     * 裏側でGitHub上の最新情報へ更新します。
     */
    const CACHE_KEY = 'mixchannel-cloudflare-watchlist-v1';

    document.addEventListener('DOMContentLoaded', () => {
      /*
       * 最初に前回の一覧が残っていれば表示します。
       */
      const cacheRestored = restoreCache();

      /*
       * 前回の一覧がない初回だけ、
       * 読み込み中の仮カードを表示します。
       */
      if (!cacheRestored) {
        renderLoadingSkeleton();
      }

      /*
       * GitHub上の最新情報を取得します。
       */
      loadList();
    });

    /*
     * 新規追加はIDだけなのでEnterで保存します。
     * 編集時は従来どおり配信者名の欄へ移動します。
     */
    document
      .getElementById('streamerId')
      .addEventListener('keydown', (event) => {
        if (event.key !== 'Enter') {
          return;
        }

        event.preventDefault();

        if (document.getElementById('targetIndex').value === '') {
          document.getElementById('streamerForm').requestSubmit();
        } else {
          document.getElementById('streamerName').focus();
        }
      });

    /*
     * ID欄から離れた時点でMixChannelのURLだった場合、
     * 画面上でも数字だけに変換します。
     */
    document
      .getElementById('streamerId')
      .addEventListener('blur', normalizeIdField);

    function setLoading(value) {
      loading = value;

      /*
       * 通信中はボタンを無効化して、
       * 連打による重複登録などを防ぎます。
       */
      document
        .querySelectorAll('button')
        .forEach((button) => {
          button.disabled = value || (button.id === 'globalMonitor' && !monitoring);
        });
    }

    function setStatus(message, type) {
      const element = document.getElementById('status');

      element.textContent = message || '';
      element.className = 'status ' + (type || '');
    }

    function setFormStatus(message, type) {
      const element = document.getElementById('formStatus');

      element.textContent = message || '';
      element.className = 'form-status ' + (type || '');
    }

    function isFormOpen() {
      return !document.getElementById('formScreen').hidden;
    }

    function handleError(error) {
      setLoading(false);

      const message =
        error && error.message
          ? error.message
          : String(error);

      /*
       * 入力画面を開いている時のエラーは、
       * 入力欄のすぐ下へ表示します。
       *
       * 背後のヘッダーへ表示してしまうと、
       * スマートフォンでは見えなくなるためです。
       */
      if (isFormOpen()) {
        setFormStatus(message, 'error');
      } else {
        setStatus(message, 'error');
      }
    }

    function loadList() {
      if (loading) return;
      // 入力中に背景の自動再読み込みで対象や版番号が変わることを防ぎます。
      if (isFormOpen()) {
        window.clearTimeout(pendingNameRefreshTimer);
        pendingNameRefreshTimer = window.setTimeout(loadList, 20000);
        return;
      }
      setLoading(true);
      setStatus('最新情報を確認中…', 'loading');

      adminApi()
        .withSuccessHandler(async (result) => {
          try { await loadMonitoring(); } catch (error) { monitoring = null; handleError(error); return; }
          setLoading(false);

          items = result.items || [];

          renderList(result.meta || {});
          saveCache(result);

          const hasPendingName =
            items.some((item) => item.pendingName);

          if (hasPendingName) {
            setStatus(
              '名前を取得中です。通常1～2分で自動更新されます…',
              'loading'
            );

            window.clearTimeout(pendingNameRefreshTimer);
            pendingNameRefreshTimer =
              window.setTimeout(loadList, 20000);
          } else {
            window.clearTimeout(pendingNameRefreshTimer);
            pendingNameRefreshTimer = null;
            setStatus('', '');
          }
        })
        .withFailureHandler(handleError)
        .getWatchlist();
    }

    function renderLoadingSkeleton() {
      document.getElementById('list').innerHTML = `
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      `;
    }

    function renderList(meta) {
      document.getElementById('count').textContent =
        items.length + '件';

      /*
       * pathやbranchは普段の登録作業には必要ないため、
       * スマートフォン画面から非表示にしました。
       *
       * ID重複がある場合だけ警告を表示します。
       */
      const duplicateIds =
        Array.isArray(meta.duplicateIds)
          ? meta.duplicateIds
          : [];

      document.getElementById('meta').textContent =
        duplicateIds.length > 0
          ? '重複ID: ' + duplicateIds.join(', ')
          : '';

      const list = document.getElementById('list');

      if (!items.length) {
        list.innerHTML =
          '<div class="empty">監視対象がありません</div>';

        return;
      }

      list.innerHTML = items
        .map((item) => `
          <section class="item">
            <div class="item-main">
              <div class="name">
                ${item.pendingName
                  ? '名前を取得中…'
                  : escapeHtml(item.name)}
              </div>

              <div class="id">
                ID: ${escapeHtml(item.id)}
                ／
                ${item.index + 1}件目
              </div>

            </div>

            <div class="actions">
              <button
                type="button"
                class="edit-button"
                onclick="openForm(${item.index})"
              >
                編集
              </button>

              <button
                type="button"
                class="delete-button"
                onclick="deleteItem(${item.index})"
              >
                削除
              </button>
            </div>
          </section>
        `)
        .join('');
    }

    function openForm(index) {
      if (loading) {
        return;
      }

      const isEdit = Number.isInteger(index);

      const item = isEdit
        ? items.find((row) => row.index === index)
        : null;

      /*
       * 編集対象が見つからなかった場合は開きません。
       */
      if (isEdit && !item) {
        setStatus(
          '編集対象が見つかりません。再読み込みしてください。',
          'error'
        );

        return;
      }

      document.getElementById('formTitle').textContent =
        isEdit
          ? '配信者を編集'
          : '新規追加';

      document.getElementById('targetIndex').value =
        item ? item.index : '';

      document.getElementById('targetId').value =
        item ? item.id : '';

      document.getElementById('targetName').value =
        item ? item.name : '';

      const archiveEnabled = !item || item.archiveEnabled !== false;
      document.getElementById('targetArchiveEnabled').value = String(archiveEnabled);

      document.getElementById('streamerId').value =
        item ? item.id : '';

      const nameInput =
        document.getElementById('streamerName');

      const nameGroup =
        document.getElementById('streamerNameGroup');

      const autoNameNote =
        document.getElementById('autoNameNote');

      nameInput.value =
        item ? item.name : '';

      /*
       * 新規追加では名前を自動取得するため、名前欄を隠します。
       * 編集時だけ手動で名前を直せる状態に戻します。
       */
      nameGroup.hidden = !isEdit;
      nameInput.required = isEdit;
      autoNameNote.hidden = isEdit;

      document.getElementById('streamerId').enterKeyHint =
        isEdit ? 'next' : 'done';

      setFormStatus('', '');

      document.getElementById('formScreen').hidden = false;
      document.body.classList.add('form-open');

      /*
       * 入力画面は常に一番上から表示します。
       *
       * dialog要素のように、以前のスクロール位置を
       * 引き継いで変な位置へ飛ぶことを防ぎます。
       */
      document.getElementById('formScreen').scrollTop = 0;

      /*
       * 新規追加ではID欄へカーソルを合わせます。
       *
       * 入力欄の文字サイズが18pxなので、
       * iPhoneの強制ズームは発生しにくくなっています。
       */
      if (!isEdit) {
        window.setTimeout(() => {
          document
            .getElementById('streamerId')
            .focus({ preventScroll: true });
        }, 50);
      }
    }

    function closeForm() {
      if (loading) {
        return;
      }

      document.getElementById('formScreen').hidden = true;
      document.body.classList.remove('form-open');

      setFormStatus('', '');
    }

    function normalizeIdField() {
      const input =
        document.getElementById('streamerId');

      const currentValue =
        input.value.trim();

      const urlMatch =
        currentValue.match(
          /^https:\/\/mixch\.tv\/u\/(\d+)(?:\/(?:live|live_archives))?\/?(?:[?#].*)?$/
        );

      /*
       * URLだった場合は、/u/の後ろの数字だけを
       * 入力欄へ戻します。
       */
      if (urlMatch) {
        input.value = urlMatch[1];
      }
    }

    function saveForm(event) {
      event.preventDefault();

      if (loading) {
        return;
      }

      const idInput =
        document
          .getElementById('streamerId')
          .value
          .trim();

      const name =
        document
          .getElementById('streamerName')
          .value
          .trim();

      if (!idInput) {
        setFormStatus(
          'IDは必須です。',
          'error'
        );

        document.getElementById('streamerId').focus();
        return;
      }

      let id;

      /*
       * 数字だけなら、そのままIDとして使用します。
       */
      if (/^\d+$/.test(idInput)) {
        id = idInput;
      } else {
        /*
         * URLの場合は、/u/の後ろの数字を取り出します。
         */
        const urlMatch =
          idInput.match(
            /^https:\/\/mixch\.tv\/u\/(\d+)(?:\/(?:live|live_archives))?\/?(?:[?#].*)?$/
          );

        if (!urlMatch) {
          setFormStatus(
            '数字のIDか、MixChannelの配信者URLを入力してください。',
            'error'
          );

          document.getElementById('streamerId').focus();
          return;
        }

        id = urlMatch[1];
      }

      const targetIndex =
        document.getElementById('targetIndex').value;

      if (targetIndex !== '' && !name) {
        setFormStatus(
          '配信者名は必須です。',
          'error'
        );

        document.getElementById('streamerName').focus();
        return;
      }

      /*
       * 新規追加はIDだけを送り、サーバー側で名前を取得します。
       * 編集時だけ、手入力した名前も送ります。
       */
      const payload =
        targetIndex === ''
          ? { id: id }
          : { id: id, name: name };

      setLoading(true);
      setFormStatus(
        targetIndex === ''
          ? 'IDを登録中…'
          : '保存中…',
        'loading'
      );

      const runner = adminApi()
        .withSuccessHandler((result) => {
          setLoading(false);

          document.getElementById('formScreen').hidden = true;
          document.body.classList.remove('form-open');

          setFormStatus('', '');
          setStatus(
            result && result.message
              ? result.message
              : '保存しました',
            'ok'
          );

          /*
           * 保存後の最新一覧を取得します。
           */
          loadList();
        })
        .withFailureHandler(handleError);

      if (targetIndex === '') {
        runner.addStreamer(payload);
      } else {
        runner.updateStreamer(
          {
            index: Number(targetIndex),
            id: document.getElementById('targetId').value,
            name: document.getElementById('targetName').value,
            archiveEnabled: document.getElementById('targetArchiveEnabled').value === 'true'
          },
          payload
        );
      }
    }

    function deleteItem(index) {
      if (loading) {
        return;
      }

      const item =
        items.find((row) => row.index === index);

      if (!item) {
        return;
      }

      const confirmed = confirm(
        item.name +
        '（ID: ' +
        item.id +
        '）を削除しますか？'
      );

      if (!confirmed) {
        return;
      }

      setLoading(true);
      setStatus('削除中…', 'loading');

      adminApi()
        .withSuccessHandler(() => {
          setLoading(false);
          setStatus('削除しました', 'ok');

          loadList();
        })
        .withFailureHandler(handleError)
        .deleteStreamer({
          index: item.index,
          id: item.id,
          name: item.name
        });
    }

    function saveCache(result) {
      try {
        localStorage.setItem(
          CACHE_KEY,
          JSON.stringify({
            items: result.items || [],
            meta: result.meta || {},
            savedAt: Date.now()
          })
        );
      } catch (error) {
        /*
         * ブラウザ側で一時保存できなくても、
         * 通常の登録・編集・削除には影響しません。
         */
      }
    }

    function restoreCache() {
      try {
        const text =
          localStorage.getItem(CACHE_KEY);

        if (!text) {
          return false;
        }

        const cache = JSON.parse(text);

        if (!cache || !Array.isArray(cache.items)) {
          return false;
        }

        items = cache.items;
        renderList(cache.meta || {});

        return true;
      } catch (error) {
        return false;
      }
    }

    function escapeHtml(value) {
      return String(value).replace(
        /[&<>'"]/g,
        (character) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[character])
      );
    }
  </script>
</body>
